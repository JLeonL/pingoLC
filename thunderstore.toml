[config]
schemaVersion = "0.0.1"

[package]
namespace = "Ctb_Eivissa"
name = "PingoEnemy"
versionNumber = "2.0.0"
description = "A harmless stationary Lethal Company enemy that gets noisier over time, especially when watched or shared in the same room."
websiteUrl = "https://github.com/JLeonL/pingoLC"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Evaisa-LethalLib = "1.2.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[publish]
repository = "https://thunderstore.io"
communities = [ "lethal-company" ]

[publish.categories]
lethal-company = [ "mods", "monsters" ]
